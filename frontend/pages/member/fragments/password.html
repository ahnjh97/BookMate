<div class="card">
    <p class="mypage-eyebrow">계정</p>
    <h1>비밀번호 변경</h1>

    <div class="field-group">
        <label for="password-current">현재 비밀번호</label>
        <input type="password" id="password-current">
    </div>

    <div class="field-group">
        <label for="password-new">새 비밀번호</label>
        <input type="password" id="password-new" placeholder="8자 이상">
    </div>

    <div class="field-group">
        <label for="password-confirm">새 비밀번호 확인</label>
        <input type="password" id="password-confirm">
    </div>

    <button type="button" id="password-save" class="button button-primary">변경</button>
    <p id="password-message" class="status-msg"></p>
</div>
