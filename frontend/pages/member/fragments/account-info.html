<!-- ============================================
     파일: pages/member/fragments/account-info.html
     목적: 닉네임/이메일/작가소개 수정 (재인증 없음)
     스타일: 인라인, mypage.css 기존 디자인 토큰 재사용(카드 톤 통일)
     ============================================ -->

<div style="
    padding: 30px;
    border: 1px solid var(--color-border);
    border-radius: 14px;
    background: var(--color-background);
    box-shadow: 0 3px 14px rgb(16 24 40 / 6%);
">
    <p style="margin:0 0 7px; color:var(--color-primary); font-size:0.76rem; font-weight:900; letter-spacing:0.12em;">계정</p>
    <h1 style="margin:0 0 24px; font-size:1.3rem; letter-spacing:-0.035em; color:var(--color-text);">내정보</h1>

    <div style="margin-bottom:20px;">
        <label style="display:block; font-size:0.82rem; font-weight:700; color:var(--color-text); margin-bottom:6px;">아이디</label>
        <input type="text" id="account-login-id" disabled style="
            width:100%; box-sizing:border-box;
            padding:11px 13px; border:1px solid var(--color-border); border-radius:8px;
            background:var(--color-surface); color:var(--color-muted); font-size:0.9rem;
        ">
        <p class="hint" style="margin:6px 0 0; font-size:0.78rem; color:var(--color-muted);">아이디는 변경할 수 없습니다.</p>
    </div>

    <div style="margin-bottom:20px;">
        <label style="display:block; font-size:0.82rem; font-weight:700; color:var(--color-text); margin-bottom:6px;">닉네임</label>
        <div style="display:flex; gap:8px;">
            <input type="text" id="account-nickname" style="
                flex:1; min-width:0; box-sizing:border-box;
                padding:11px 13px; border:1px solid var(--color-border); border-radius:8px;
                font-size:0.9rem; color:var(--color-text);
            ">
            <button type="button" id="account-check-nickname" style="
                white-space:nowrap; padding:0 16px;
                border:1px solid var(--color-primary); border-radius:8px;
                background:transparent; color:var(--color-primary);
                font-size:0.84rem; font-weight:700; cursor:pointer;
            ">중복확인</button>
        </div>
        <p id="account-nickname-hint" class="hint" style="margin:6px 0 0; font-size:0.78rem; color:var(--color-muted);"></p>
    </div>

    <div style="margin-bottom:20px;">
        <label style="display:block; font-size:0.82rem; font-weight:700; color:var(--color-text); margin-bottom:6px;">이메일</label>
        <div style="display:flex; gap:8px;">
            <input type="email" id="account-email" style="
                flex:1; min-width:0; box-sizing:border-box;
                padding:11px 13px; border:1px solid var(--color-border); border-radius:8px;
                font-size:0.9rem; color:var(--color-text);
            ">
            <button type="button" id="account-check-email" style="
                white-space:nowrap; padding:0 16px;
                border:1px solid var(--color-primary); border-radius:8px;
                background:transparent; color:var(--color-primary);
                font-size:0.84rem; font-weight:700; cursor:pointer;
            ">중복확인</button>
        </div>
        <p id="account-email-hint" class="hint" style="margin:6px 0 0; font-size:0.78rem; color:var(--color-muted);"></p>
    </div>

    <div id="account-author-section" hidden style="margin-bottom:20px;">
        <label style="display:block; font-size:0.82rem; font-weight:700; color:var(--color-text); margin-bottom:6px;">작가 소개</label>
        <textarea id="account-self-intro" placeholder="독자에게 보여줄 한마디를 남겨보세요." style="
            width:100%; box-sizing:border-box; min-height:80px; resize:vertical;
            padding:11px 13px; border:1px solid var(--color-border); border-radius:8px;
            font-size:0.9rem; color:var(--color-text); font-family:inherit;
        "></textarea>
    </div>

    <button type="button" id="account-save" style="
        padding:12px 26px; border:none; border-radius:8px;
        background:var(--color-primary); color:#fff;
        font-size:0.88rem; font-weight:700; cursor:pointer;
    ">저장</button>

    <p id="account-message" class="status-msg" style="
        margin-top:14px; padding:10px 14px; border-radius:8px; font-size:0.84rem; display:none;
    "></p>
</div>
