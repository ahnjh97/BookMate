<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 | BookMate</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=20260831-8">
    <link rel="stylesheet" href="/assets/css/book-list.css?v=20260831-7">
</head>
<body>
<header class="site-header" data-navbar></header>

<main data-page="books">
    <section>
        <div class="book-page-hero">
            <div class="book-page-heading">
                <button id="book-reset-button" class="page-gradient-title page-title-button" type="button"><span class="page-title-icon page-title-icon-bookshelf" aria-hidden="true"></span>책 목록</button>
            </div>

            <div class="book-tools-row">
                <form id="book-search-form" class="book-tools list-search-form" role="search">
                    <div class="book-keyword-field">
                        <input id="book-keyword" name="keyword" type="search"
                               aria-label="책 검색어" aria-autocomplete="list"
                               aria-controls="search-suggestions"
                               aria-expanded="false"
                               placeholder="책 제목 또는 작가명" autocomplete="off">
                        <div id="search-suggestions" role="listbox" hidden></div>
                    </div>
                    <button class="button button-primary" type="submit">검색</button>
                </form>
                <a class="button button-teal book-create-button" href="/pages/book/request.html">책 등록하기</a>
            </div>
        </div>

        <div class="book-result-context" aria-live="polite">
            <div id="author-filter-heading" class="author-filter-heading" hidden>
                <strong id="selected-author-name"></strong><span> 님의 작품입니다.</span>
                <a href="/pages/book/list.html">전체 책 보기</a>
            </div>
            <div id="search-filter-heading" class="search-filter-heading list-search-result-heading" hidden>
                <strong id="selected-search-keyword"></strong><span>에 대한 검색결과입니다.</span>
                <a href="/pages/book/list.html">전체 책 보기</a>
            </div>
        </div>

        <div class="book-filter-bar">
            <div class="book-category-tabs choice-tabs" role="group" aria-label="책 장르">
                <button class="is-active" type="button" data-genre="">전체</button>
                <button type="button" data-genre="소설">소설</button>
                <button type="button" data-genre="판타지">판타지</button>
                <button type="button" data-genre="SF">SF</button>
                <button type="button" data-genre="추리">추리</button>
                <button type="button" data-genre="인문/사회">인문/사회</button>
                <button type="button" data-genre="자기계발">자기계발</button>
                <button type="button" data-genre="과학/IT">과학/IT</button>
            </div>
            <div class="book-filter-actions">
                <span id="book-total-count" class="book-total-count"></span>
                <label class="book-sort-control" for="book-sort">
                    <select id="book-sort" name="sort">
                        <option value="rating">평점 높은 순</option>
                        <option value="title">제목순</option>
                        <option value="newest">최신 출간순</option>
                    </select>
                </label>
            </div>
        </div>

        <div class="book-results-panel">
            <div id="book-list" class="book-grid"></div>
            <nav id="book-pagination" class="book-pagination" aria-label="책 목록 페이지">
                <button id="book-prev-page" class="button button-outline" type="button">이전</button>
                <div id="book-page-numbers" class="book-page-numbers" aria-live="polite"></div>
                <button id="book-next-page" class="button button-outline" type="button">다음</button>
            </nav>
        </div>
    </section>
</main>

<script src="/js/components/navbar.js" defer></script>
<script src="/js/components/flash-toast.js" defer></script>
<script src="/js/components/book-genre.js?v=20260831-1" defer></script>
<script src="/js/pages/book-list.js?v=20260831-6" defer></script>
</body>
</html>
