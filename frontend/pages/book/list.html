<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>책 | BookMate</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=20260828-3">
    <link rel="stylesheet" href="/assets/css/book-list.css">
</head>
<body>
<header class="site-header" data-navbar></header>

<main data-page="books">
    <section>
        <div class="book-page-hero">
            <div class="book-page-heading">
                <button id="book-reset-button" class="page-gradient-title page-title-button" type="button">독자들이 추천하는 다양한 책을 만나보세요</button>
            </div>

            <form id="book-search-form" class="book-tools" role="search">
                <div class="book-keyword-field">
                    <input id="book-keyword" name="keyword" type="search"
                           aria-label="책 검색어" aria-autocomplete="list"
                           aria-controls="search-suggestions"
                           aria-expanded="false"
                           placeholder="책 제목 또는 작가명" autocomplete="off">
                    <div id="search-suggestions" role="listbox" hidden></div>
                </div>
                <button class="button button-primary" type="submit">검색</button>
            </form>
        </div>

        <div class="book-result-context" aria-live="polite">
            <div id="author-filter-heading" class="author-filter-heading" hidden>
                <strong id="selected-author-name"></strong><span> 님의 작품입니다.</span>
                <a href="/pages/book/list.html">전체 책 보기</a>
            </div>
            <div id="search-filter-heading" class="search-filter-heading" hidden>
                <strong id="selected-search-keyword"></strong><span>에 대한 검색결과입니다.</span>
                <a href="/pages/book/list.html">전체 책 보기</a>
            </div>
        </div>

        <div class="book-filter-bar">
            <div class="book-category-tabs" role="group" aria-label="책 장르">
                <button class="is-active" type="button" data-genre="">전체</button>
                <button type="button" data-genre="판타지">판타지</button>
                <button type="button" data-genre="SF">SF</button>
                <button type="button" data-genre="추리">추리</button>
                <button type="button" data-genre="인문">인문/사회</button>
                <button type="button" data-genre="자기계발">자기계발</button>
                <button type="button" data-genre="과학">과학</button>
                <button type="button" data-genre="IT">IT</button>
            </div>
            <label class="book-sort-control" for="book-sort">
                <select id="book-sort" name="sort">
                    <option value="rating">평점 높은 순</option>
                    <option value="title">제목순</option>
                    <option value="newest">최신 출간순</option>
                </select>
            </label>
        </div>

        <div class="book-results-panel">
            <p id="book-status" aria-live="polite">책 목록을 불러오는 중입니다.</p>
            <div id="book-list" class="book-grid"></div>
        </div>
    </section>
</main>

<script src="/js/components/navbar.js" defer></script>
<script src="/js/pages/book-list.js?v=20260828-7" defer></script>
</body>
</html>
