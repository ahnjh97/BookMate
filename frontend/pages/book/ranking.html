<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장르별 책 랭킹 | BookMate</title>
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/book-ranking.css?v=20260827-1">
</head>
<body>
  <header class="site-header" data-navbar></header>
  <main class="ranking-page">
    <section class="ranking-shell" aria-labelledby="ranking-title">
      <header class="ranking-heading">
        <p>BOOKMATE RANKING</p>
        <h1 id="ranking-title">장르별 책 랭킹</h1>
        <span>평가에 참여한 독자들의 기록을 기준으로 순위를 보여드립니다.</span>
      </header>

      <form id="ranking-filter" class="ranking-filter">
        <label>
          장르
          <select id="ranking-genre" name="genre">
            <option value="판타지">판타지</option>
            <option value="SF">SF</option>
            <option value="디스토피아">디스토피아</option>
            <option value="추리">추리</option>
            <option value="스릴러">스릴러</option>
            <option value="인문">인문</option>
            <option value="과학">과학</option>
            <option value="자기계발">자기계발</option>
            <option value="IT">IT</option>
          </select>
        </label>
        <label>
          정렬 기준
          <select id="ranking-sort" name="sort">
            <option value="average">평균 평점순</option>
            <option value="count">참여 인원순</option>
          </select>
        </label>
        <label>
          최소 평가 인원
          <select id="ranking-minimum" name="minimumRatings">
            <option value="1">1명 이상</option>
            <option value="3">3명 이상</option>
            <option value="5">5명 이상</option>
            <option value="10">10명 이상</option>
          </select>
        </label>
      </form>

      <p id="ranking-status" class="ranking-status" role="status" aria-live="polite">랭킹을 불러오는 중입니다.</p>
      <ol id="ranking-list" class="ranking-list"></ol>
    </section>
  </main>
  <script type="module" src="/js/components/navbar.js" defer></script>
  <script src="/js/pages/book-ranking.js?v=20260827-1" defer></script>
</body>
</html>
