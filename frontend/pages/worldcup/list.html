<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>책 이상형 월드컵 | BookMate</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=20260831-1">
  <link rel="stylesheet" href="/assets/css/book-list.css?v=20260830-3">
  <link rel="stylesheet" href="/assets/css/worldcup.css?v=20260831-2">
</head>
<body>
  <header class="site-header" data-navbar></header>
  <main class="worldcup-page">
    <div class="worldcup-container">
      <header class="worldcup-header worldcup-list-header">
        <button id="worldcup-reset-button" class="page-gradient-title page-title-button" type="button">
          <span class="page-title-icon page-title-icon-trophy" aria-hidden="true"></span>이상형 월드컵
        </button>
      </header>
      <div class="book-filter-bar">
        <div class="book-category-tabs choice-tabs" role="group" aria-label="이상형 월드컵 참여 상태">
          <button class="is-active" type="button" data-participation="all" aria-pressed="true">전체</button>
          <button type="button" data-participation="participated" aria-pressed="false">참여 템플릿</button>
          <button type="button" data-participation="not-participated" aria-pressed="false">미참여 템플릿</button>
        </div>
        <a class="button button-teal" href="/pages/worldcup/create.html">새 템플릿 만들기</a>
      </div>
      <div id="grid" class="worldcup-grid"></div>
      <nav id="worldcup-pagination" class="list-pagination" aria-label="이상형월드컵 목록 페이지">
        <button class="button button-outline" type="button" data-pagination-prev>이전</button>
        <div class="list-page-numbers" data-pagination-numbers aria-live="polite"></div>
        <button class="button button-outline" type="button" data-pagination-next>다음</button>
      </nav>
    </div>
  </main>
  <script src="/js/components/navbar.js" defer></script>
  <script src="/js/components/flash-toast.js?v=20260831-1" defer></script>
  <script src="/js/components/list-pagination.js?v=20260831-1" defer></script>
  <script src="/js/pages/worldcup-list.js?v=20260831-1" defer></script>
</body>
</html>
