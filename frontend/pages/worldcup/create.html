<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>월드컵 템플릿 만들기 | BookMate</title>
  <link rel="stylesheet" href="/assets/css/style.css?v=20260828-5">
  <link rel="stylesheet" href="/assets/css/worldcup.css?v=1">
  <script src="/js/components/auth-guard.js"></script>
</head>
<body>
  <header class="site-header" data-navbar></header>
  <main class="worldcup-page">
    <div class="worldcup-container">
      <header class="worldcup-header">
        <div>
          <h1>월드컵 템플릿 만들기</h1>
          <p>
            8강과 16강을 모두 지원하도록 책을 16권 이상
            골라주세요.
          </p>
        </div>
      </header>
      <form id="form" class="worldcup-form">
        <label>카테고리<select id="category" required>
            <option value="자유">자유</option>
            <option value="장르">장르</option>
          </select></label><label>템플릿 이름<input
            id="title"
            maxlength="200"
            required
            placeholder="예: 내 인생 판타지 소설 월드컵"
          ></label><label>소개<textarea
            id="description"
            maxlength="1000"
            rows="3"
            placeholder="어떤 책을 모은 월드컵인지 알려주세요."
          ></textarea></label><label>책 검색<input
            id="book-search"
            type="search"
            placeholder="제목 또는 작가"
          ></label><div class="worldcup-form-footer">
          <strong id="count">0권 선택</strong><span>최소 16권 · 최대
            64권</span>
        </div>
        <div id="picker" class="worldcup-picker"></div>
        <p id="message" class="worldcup-status"></p>
        <div class="worldcup-form-footer">
          <a class="button button-white" href="/pages/worldcup/list.html"
          >취소</a><button class="button button-teal">
            템플릿 공개하기
          </button>
        </div>
      </form>
    </div>
  </main>
  <script src="/js/components/navbar.js" defer></script>
  <script src="/js/pages/worldcup-create.js?v=1" defer></script>
</body>
</html>
