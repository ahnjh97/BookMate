<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>로그인 | BookMate</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header" data-navbar></header>

  <main class="page-main">
    <section class="page-content auth-card">
      <h1>로그인</h1>
      <form class="auth-form" id="login-form">
        <label for="login-id">아이디</label>
        <input id="login-id" name="loginId" autocomplete="username" required>
        <label for="password">비밀번호</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <p class="form-message" id="form-message" aria-live="polite"></p>
        <button class="button button-primary" type="submit">로그인</button>
      </form>
      <p class="auth-help">아직 회원이 아니라면 <a href="/pages/auth/signup.html">회원가입</a></p>
    </section>
  </main>
  <script type="module" src="/js/components/navbar.js" defer></script>
  <script type="module" src="/js/pages/login.js"></script>
</body>
</html>
