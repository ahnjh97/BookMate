<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>게시글 | BookMate</title>

    <link rel="stylesheet" href="/assets/css/style.css?v=20260831-2">
    <link rel="stylesheet" href="/assets/css/post.css?v=20260831-8">
</head>

<body>
<header class="site-header" data-navbar></header>

<main class="post-page-main">
    <div class="post-detail-back">
        <a class="back-navigation" href="/pages/post/list.html">← 커뮤니티 목록으로</a>
    </div>
    <article id="post-detail" class="post-detail" hidden>
        <div class="post-detail-category">
            <span id="post-category"></span>
            <span id="post-genre"></span>
        </div>

        <h1 id="post-title"></h1>

        <div class="post-detail-meta">
            <span>
                작성자:
                <strong id="post-writer"></strong>
            </span>

            <span>
                조회수:
                <strong id="post-view-count"></strong>
            </span>

            <span>
                작성일:
                <time id="post-created-at"></time>
            </span>

            <span>
                좋아요:
                <strong id="post-like-count">0</strong>
            </span>
        </div>

        <div id="post-content" class="post-detail-content"></div>
        <section id="post-tier-list" class="post-tier-list" aria-labelledby="post-tier-list-heading" hidden>
            <h2 id="post-tier-list-heading">티어리스트 결과</h2>
            <div id="post-tier-board" class="post-tier-board"></div>
        </section>
        <section id="post-worldcup-result" class="post-worldcup-result" aria-labelledby="post-worldcup-heading" hidden>
            <h2 id="post-worldcup-heading">이상형월드컵 결과</h2>
            <div id="post-worldcup-winner"></div>
        </section>

        <div class="post-detail-actions">
            <div id="writer-actions" class="post-action-group" hidden>
                <a id="post-edit-link" class="button" href="#">수정</a>
                <button id="post-hide-button" class="button" type="button">숨김</button>
                <button id="post-delete-button" class="button" type="button">삭제</button>
            </div>

            <div id="member-actions" class="post-action-group" hidden>
                <button id="post-like-button" class="button" type="button">좋아요</button>
                <button id="post-report-button" class="button" type="button">신고</button>
            </div>
        </div>
    </article>

    <p id="post-detail-status" class="post-detail-status" aria-live="polite">
        게시글을 불러오는 중입니다.
    </p>
</main>

<script src="/js/components/navbar.js" charset="UTF-8" defer></script>
<script src="/js/components/flash-toast.js?v=20260831-1" defer></script>
<script src="/js/pages/post-detail.js?v=20260831-3" charset="UTF-8" defer></script>
</body>
</html>
