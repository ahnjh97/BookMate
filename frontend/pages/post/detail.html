<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>게시글 | BookMate</title>

    <link
            rel="stylesheet"
            href="/assets/css/style.css"
    >
    <link
            rel="stylesheet"
            href="/assets/css/post.css"
    >
</head>

<body>
<header class="site-header" data-navbar></header>

<main class="post-page-main">
    <article
            id="post-detail"
            class="post-detail"
            hidden
    >
        <div class="post-detail-category">
            <span id="post-category"></span>
        </div>

        <h1 id="post-title"></h1>

        <div class="post-detail-meta">
            <span>
                작성자:
                <strong id="post-writer"></strong>
            </span>

            <span>
                조회수:
                <strong id="post-view-count"></strong>
            </span>

            <span>
                작성일:
                <time id="post-created-at"></time>
            </span>
        </div>

        <div
                id="post-content"
                class="post-detail-content"
        ></div>

        <div class="post-detail-actions">
            <a
                    class="button"
                    href="/pages/post/list.html"
            >
                목록으로
            </a>
        </div>
    </article>

    <p
            id="post-detail-status"
            class="post-detail-status"
            aria-live="polite"
    >
        게시글을 불러오는 중입니다.
    </p>
</main>

<script src="/js/components/navbar.js" defer></script>
<script
        src="/js/pages/post-detail.js"
        defer
></script>
</body>
</html>
