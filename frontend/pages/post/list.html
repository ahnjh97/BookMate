<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 | BookMate</title>
    <link rel="stylesheet" href="/assets/css/style.css?v=20260830-4">
    <link rel="stylesheet" href="/assets/css/post.css?v=20260831-7">
</head>

<body>
<header class="site-header" data-navbar></header>

<main class="page-main" data-page="community">
    <section class="page-content">

        <!-- 1. 커뮤니티 상단 -->
        <div class="community-page-hero">
            <div class="community-page-header">
                <div class="community-page-heading">
                    <button
                            id="community-reset-button"
                            class="page-gradient-title page-title-button"
                            type="button"
                    >
                        <span
                                class="page-title-icon page-title-icon-community"
                                aria-hidden="true"
                        ></span>
                        커뮤니티
                    </button>

                    <p class="community-page-description">
                        책을 좋아하는 사람들이 자유롭게 이야기를 나누는 공간입니다.
                    </p>
                </div>

                <a
                        class="button button-primary community-create-button"
                        href="/pages/post/create.html"
                >
                    + 게시글 작성
                </a>
            </div>
        </div>

        <!-- 2. 커뮤니티 필터 -->
        <section id="community-filter" class="community-filter">

            <!-- 2-1. 카테고리 -->
            <div class="post-filter-group">
                <span class="post-filter-label">카테고리</span>

                <div class="post-category-tabs choice-tabs">
                    <button
                            class="is-active"
                            type="button"
                            data-category=""
                    >
                        전체
                    </button>

                    <button type="button" data-category="FREE">
                        자유
                    </button>

                    <button type="button" data-category="RECOMMEND">
                        추천
                    </button>

                    <button type="button" data-category="REVIEW">
                        리뷰
                    </button>

                    <button type="button" data-category="TIER">
                        티어리스트
                    </button>

                    <button type="button" data-category="WORLDCUP">
                        이상형월드컵
                    </button>

                    <button type="button" data-category="AUTHOR">
                        작가
                    </button>
                </div>
            </div>

            <!-- 2-2. 장르 -->
            <div class="post-filter-group">
                <span class="post-filter-label">장르</span>

                <div class="post-genre-tabs choice-tabs">
                    <button
                            class="is-active"
                            type="button"
                            data-genre=""
                    >
                        전체
                    </button>

                    <button type="button" data-genre="판타지">
                        판타지
                    </button>

                    <button type="button" data-genre="SF">
                        SF
                    </button>

                    <button type="button" data-genre="추리">
                        추리
                    </button>

                    <button type="button" data-genre="인문">
                        인문/사회
                    </button>

                    <button type="button" data-genre="자기계발">
                        자기계발
                    </button>

                    <button type="button" data-genre="과학">
                        과학
                    </button>

                    <button type="button" data-genre="IT">
                        IT
                    </button>
                </div>
            </div>

            <!-- 2-3. 정렬 및 검색 -->
            <div class="post-filter-group post-filter-toolbar">
                <span class="post-filter-label">정렬</span>

                <div class="post-toolbar-content">
                    <div class="post-sort-tabs" role="group" aria-label="게시글 정렬">
                        <button
                                class="is-active"
                                type="button"
                                data-sort="latest"
                        >
                            최신순
                        </button>
                        <button
                                type="button"
                                data-sort="views"
                        >
                            조회순
                        </button>
                        <button
                                type="button"
                                data-sort="likes"
                        >
                            좋아요순
                        </button>
                    </div>

                    <form id="post-search-form" class="post-search-form" role="search">
                        <label class="post-search-type-control">
                            <span class="sr-only">검색 조건</span>
                            <select id="post-search-type">
                                <option value="title">제목</option>
                                <option value="writer">작성자</option>
                            </select>
                        </label>

                        <input
                                id="post-keyword"
                                type="search"
                                placeholder="검색어를 입력하세요"
                                aria-label="게시글 검색"
                        >

                        <button class="button button-primary" type="submit">
                            검색
                        </button>
                    </form>
                </div>
            </div>

        </section>

        <!-- 3. 검색 결과 -->
        <div class="post-list-information">
            <p
                    id="post-result-message"
                    class="post-result-message"
            ></p>
        </div>

        <!-- 4. 게시글 목록 -->
        <section class="post-list-section">
            <div class="post-table-wrap">
                <table class="post-table">
                    <colgroup>
                        <col class="post-col-category">
                        <col class="post-col-title">
                        <col class="post-col-genre">
                        <col class="post-col-writer">
                        <col class="post-col-date">
                        <col class="post-col-count">
                        <col class="post-col-count">
                        <col class="post-col-count">
                    </colgroup>

                    <thead id="post-table-head"></thead>

                    <tbody id="post-list"></tbody>
                </table>
            </div>

            <p
                    id="post-status"
                    class="post-status"
                    aria-live="polite"
            >
                게시글을 불러오는 중입니다.
            </p>
        </section>

        <!-- 5. 페이지네이션 -->
        <nav
                id="post-pagination"
                class="list-pagination"
                aria-label="커뮤니티 목록 페이지"
        >
            <button
                    class="button button-outline"
                    type="button"
                    data-pagination-prev
            >
                이전
            </button>

            <div
                    class="list-page-numbers"
                    data-pagination-numbers
                    aria-live="polite"
            ></div>

            <button
                    class="button button-outline"
                    type="button"
                    data-pagination-next
            >
                다음
            </button>
        </nav>

    </section>
</main>

<script src="/js/components/navbar.js" defer></script>
<script src="/js/components/list-pagination.js?v=20260831-2" defer></script>
<script src="/js/pages/post-list.js?v=20260831-9" defer></script>
</body>
</html>
