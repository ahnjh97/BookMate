<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>커뮤니티 | BookMate</title>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link rel="stylesheet" href="/assets/css/post.css">
</head>
<body>
<header class="site-header" data-navbar></header>

<main class="post-page-main">
    <section class="post-page-content">
        <!-- Figma 커뮤니티 제목·설명과 기존 글쓰기 기능을 묶은 헤더 -->
        <div class="post-page-header">
            <div>
                <h1>커뮤니티 인기글</h1>
                <p>독자들과 책에 대한 다양한 이야기를 나눠보세요.</p>
            </div>
            <a class="button button-primary" href="/pages/post/create.html">게시글 작성</a>
        </div>

        <p id="post-status" class="post-status" aria-live="polite">
            게시글을 불러오는 중입니다.
        </p>

        <!-- 카테고리를 제목에 포함한 Figma 형태의 인기글 표 -->
        <div class="post-table-wrapper">
            <table class="post-table">
                <thead>
                <tr>
                    <th class="post-number">순위</th>
                    <th>제목</th>
                    <th class="post-writer">작성자</th>
                    <th class="post-date">작성일</th>
                    <th class="post-views">조회수</th>
                </tr>
                </thead>
                <!-- JavaScript가 API 게시글을 순위형 행으로 렌더링합니다. -->
                <tbody id="post-list"></tbody>
            </table>
        </div>
    </section>
</main>

<script src="/js/components/navbar.js" defer></script>
<script src="/js/pages/post-list.js" defer></script>
</body>
</html>
