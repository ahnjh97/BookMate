<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >
    <title>게시글 작성 | BookMate</title>

    <link
            rel="stylesheet"
            href="/assets/css/style.css"
    >
    <link
            rel="stylesheet"
            href="/assets/css/post.css"
    >
</head>

<body>
<header class="site-header" data-navbar></header>

<main class="page-main">
    <section class="page-content">
        <h1>게시글 작성</h1>

        <form id="post-create-form">
            <div>
                <label for="category">카테고리</label>

                <select id="category" required>
                    <option value="">선택하세요</option>
                    <option value="FREE">자유</option>
                    <option value="RECOMMEND">추천</option>
                    <option value="REVIEW">리뷰</option>
                    <option value="TIER">티어</option>
                    <option value="AUTHOR">작가</option>
                </select>
            </div>

            <div>
                <label for="title">제목</label>

                <input
                        id="title"
                        type="text"
                        maxlength="200"
                        required
                >
            </div>

            <div>
                <label for="content">내용</label>

                <textarea
                        id="content"
                        maxlength="4000"
                        rows="15"
                        required
                ></textarea>
            </div>

            <button
                    class="button button-primary"
                    type="submit"
            >
                등록
            </button>

            <a
                    class="button"
                    href="/pages/post/list.html"
            >
                취소
            </a>
        </form>

        <p id="message"></p>
    </section>
</main>

<script src="/js/components/navbar.js" defer></script>
<script src="/js/pages/post-create.js" defer></script>
</body>
</html>
